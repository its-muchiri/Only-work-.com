<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Onlywork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .btn-full { width: 100%; }
      .auth-secondary { margin-top: 12px; text-align: center; }
      .auth-secondary a { color: var(--muted); font-size: 0.85rem; }
      .form-success { color: var(--success); font-size: 0.85rem; min-height: 1.1em; }
    </style>
  </head>
  <body class="auth-body">
    <script src="auth.js"></script>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

    <main class="auth-card">
      <a class="brand" href="index.html" style="display:flex;justify-content:center;margin-bottom:24px;">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Onlywork<span class="brand-tld">.com</span></span>
      </a>
      <h1 class="auth-title">Reset your password</h1>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:20px;">
        Enter your email and we'll send a reset link if an account exists.
      </p>
      <form id="forgot-form">
        <p id="form-error" class="form-error" role="alert"></p>
        <p id="form-success" class="form-success" role="status"></p>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
      </form>
      <p class="auth-secondary"><a href="login.html">Back to log in</a></p>
    </main>

    <script src="js/api.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        if (window.OnlyworkAuth) await window.OnlyworkAuth.redirectIfAuthed();

        var form = document.getElementById('forgot-form');
        var err = document.getElementById('form-error');
        var suc = document.getElementById('form-success');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          err.textContent = '';
          suc.textContent = '';
          var btn = form.querySelector('[type=submit]');
          btn.disabled = true;
          btn.textContent = 'Sending…';

          var r = await window.OnlyworkAPI.post('/auth/forgot-password', {
            email: document.getElementById('email').value,
          });

          btn.disabled = false;
          btn.textContent = 'Send reset link';

          if (r.ok) {
            suc.textContent = 'If that email is registered, a reset link has been sent.';
            form.reset();
          } else {
            err.textContent = r.error || 'Something went wrong. Please try again.';
          }
        });
      });
    </script>
  </body>
</html>
