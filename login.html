<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Onlywork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .btn-full { width: 100%; }
      .auth-secondary { margin-top: 12px; }
      .auth-secondary a { color: var(--muted); font-size: 0.85rem; }
      .form-error--success { color: var(--success) !important; }
    </style>
  </head>
  <body class="auth-body">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Onlywork<span class="brand-tld">.com</span></span>
        </a>
        <div class="header-actions">
          <a class="btn btn-ghost" href="index.html">Home</a>
          <a class="btn btn-primary" href="signup.html">Sign up</a>
        </div>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-lede">Log in to open your workspace, tasks, and payouts.</p>
        <form id="login-form" novalidate>
          <p id="login-error" class="form-error" role="alert"></p>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn btn-primary btn-lg btn-full" type="submit">
            Log in
          </button>
        </form>
        <p class="auth-footer auth-secondary">
          <a href="forgot-password.html">Forgot password?</a>
        </p>
        <p class="auth-footer">
          New here? <a href="signup.html">Create an account</a>
        </p>
      </div>
    </main>

    <script src="auth.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (window.OnlyworkAuth) await OnlyworkAuth.redirectIfAuthed();

        var form = document.getElementById("login-form");
        var err = document.getElementById("login-error");

        // Show verified success message if redirected from email verification
        if (new URLSearchParams(location.search).get("verified") === "1") {
          err.classList.add("form-error--success");
          err.textContent = "Email verified! You can now log in.";
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          err.textContent = "";
          err.classList.remove("form-error--success");
          var btn = form.querySelector("[type=submit]");
          btn.disabled = true;
          btn.textContent = "Logging in…";

          var fd = new FormData(form);
          var res = await OnlyworkAuth.login({
            email: fd.get("email"),
            password: fd.get("password"),
          });

          btn.disabled = false;
          btn.textContent = "Log in";

          if (!res.ok) {
            err.textContent = res.error || "Could not log in.";
            return;
          }

          var params = new URLSearchParams(location.search);
          var next = params.get("next");
          if (next && /\.html$/i.test(next) && next.indexOf("..") === -1) {
            location.href = next;
          } else {
            location.href = "tasks.html";
          }
        });
      });
    </script>
  </body>
</html>
