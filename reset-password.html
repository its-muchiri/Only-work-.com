<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Onlywork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .btn-full { width: 100%; }
      .auth-secondary { margin-top: 12px; text-align: center; }
      .auth-secondary a { color: var(--muted); font-size: 0.85rem; }
    </style>
  </head>
  <body class="auth-body">
    <script src="auth.js"></script>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--2" aria-hidden="true"></div>

    <main class="auth-card">
      <a class="brand" href="index.html" style="display:flex;justify-content:center;margin-bottom:24px;">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Onlywork<span class="brand-tld">.com</span></span>
      </a>
      <h1 class="auth-title">Set new password</h1>
      <div id="invalid-token" hidden style="text-align:center;padding:20px 0;">
        <p style="color:var(--muted);">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn btn-outline" style="margin-top:12px;display:inline-block;">Request a new link</a>
      </div>
      <form id="reset-form">
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="form-field">
          <label for="new-password">New password</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters" />
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your new password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Update password</button>
      </form>
      <p class="auth-secondary"><a href="login.html">Back to log in</a></p>
    </main>

    <script src="js/api.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async function () {
        if (window.OnlyworkAuth) await window.OnlyworkAuth.redirectIfAuthed();

        var token = new URLSearchParams(location.search).get('token');
        if (!token) {
          document.getElementById('reset-form').hidden = true;
          document.getElementById('invalid-token').hidden = false;
          return;
        }

        var form = document.getElementById('reset-form');
        var err = document.getElementById('form-error');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          err.textContent = '';

          var newPw = document.getElementById('new-password').value;
          var confirmPw = document.getElementById('confirm-password').value;
          if (newPw !== confirmPw) {
            err.textContent = 'Passwords do not match.';
            return;
          }

          var btn = form.querySelector('[type=submit]');
          btn.disabled = true;
          btn.textContent = 'Updating…';

          var r = await window.OnlyworkAPI.post('/auth/reset-password', {
            token: token,
            newPassword: newPw,
          });

          btn.disabled = false;
          btn.textContent = 'Update password';

          if (r.ok) {
            if (window.OnlyworkAuth) window.OnlyworkAuth.showToast('Password updated! Please log in.', 'success');
            setTimeout(function () { location.replace('login.html'); }, 1200);
          } else if (r.error && (r.error.includes('expired') || r.error.includes('invalid'))) {
            form.hidden = true;
            document.getElementById('invalid-token').hidden = false;
          } else {
            err.textContent = r.error || 'Could not reset password. Please try again.';
          }
        });
      });
    </script>
  </body>
</html>
