<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payout processed</title></head>
<body style="margin:0;padding:0;background:#09090b;font-family:Inter,system-ui,sans-serif;color:#f4f4f5;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;padding:40px 20px;">
  <tr><td align="center">
    <table width="520" cellpadding="0" cellspacing="0" style="background:#121216;border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:40px;">
      <tr><td>
        <div style="font-size:32px;margin-bottom:16px;">💸</div>
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;">Payout processed</h1>
        <p style="margin:0 0 16px;color:#a1a1aa;font-size:15px;">Hi {{name}}, your payout has been sent to your connected account.</p>
        <div style="background:rgba(45,212,191,0.1);border:1px solid rgba(45,212,191,0.3);border-radius:12px;padding:16px 20px;margin-bottom:24px;">
          <p style="margin:0;font-size:28px;font-weight:700;color:#2dd4bf;">{{amount}}</p>
          <p style="margin:4px 0 0;color:#a1a1aa;font-size:13px;">Stripe transfer ID: {{stripeId}}</p>
        </div>
        <p style="margin:0;color:#71717a;font-size:13px;">Funds typically arrive within 1–2 business days depending on your bank.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
