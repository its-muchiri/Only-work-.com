<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work approved</title></head>
<body style="margin:0;padding:0;background:#09090b;font-family:Inter,system-ui,sans-serif;color:#f4f4f5;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;padding:40px 20px;">
  <tr><td align="center">
    <table width="520" cellpadding="0" cellspacing="0" style="background:#121216;border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:40px;">
      <tr><td>
        <div style="font-size:32px;margin-bottom:16px;">✅</div>
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#34d399;">Work approved!</h1>
        <p style="margin:0 0 16px;color:#a1a1aa;font-size:15px;">Hi {{name}}, your submission for <strong style="color:#f4f4f5;">{{taskTitle}}</strong> has been approved.</p>
        <div style="background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.3);border-radius:12px;padding:16px 20px;margin-bottom:24px;">
          <p style="margin:0;font-size:24px;font-weight:700;color:#34d399;">{{payout}}</p>
          <p style="margin:4px 0 0;color:#a1a1aa;font-size:13px;">Payout pending — will be processed soon.</p>
        </div>
        <a href="#" style="display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fafafa;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;">View your payouts</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
