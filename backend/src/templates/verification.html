<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email</title></head>
<body style="margin:0;padding:0;background:#09090b;font-family:Inter,system-ui,sans-serif;color:#f4f4f5;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;padding:40px 20px;">
  <tr><td align="center">
    <table width="520" cellpadding="0" cellspacing="0" style="background:#121216;border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:40px;">
      <tr><td>
        <div style="display:inline-block;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#7c3aed);margin-bottom:20px;"></div>
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-0.02em;">Verify your email</h1>
        <p style="margin:0 0 24px;color:#a1a1aa;font-size:15px;">Hi {{name}}, thanks for joining Onlywork. Click below to verify your email address.</p>
        <a href="{{link}}" style="display:inline-block;padding:14px 28px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fafafa;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;">Verify email address</a>
        <p style="margin:24px 0 0;color:#71717a;font-size:13px;">Link expires in 24 hours. If you didn't create an account, you can ignore this email.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
