<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision requested</title></head>
<body style="margin:0;padding:0;background:#09090b;font-family:Inter,system-ui,sans-serif;color:#f4f4f5;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#09090b;padding:40px 20px;">
  <tr><td align="center">
    <table width="520" cellpadding="0" cellspacing="0" style="background:#121216;border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:40px;">
      <tr><td>
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;">Revision requested</h1>
        <p style="margin:0 0 16px;color:#a1a1aa;font-size:15px;">Hi {{name}}, your submission for <strong style="color:#f4f4f5;">{{taskTitle}}</strong> needs a revision.</p>
        <div style="background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:12px;padding:16px 20px;margin-bottom:24px;">
          <p style="margin:0 0 4px;font-size:12px;font-weight:600;color:#f87171;text-transform:uppercase;letter-spacing:0.06em;">Reviewer feedback</p>
          <p style="margin:0;color:#e4e4e7;font-size:15px;">{{feedback}}</p>
        </div>
        <p style="margin:0 0 20px;color:#a1a1aa;font-size:14px;">The task has been moved back to "In Progress". Please address the feedback and resubmit.</p>
        <a href="#" style="display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fafafa;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;">Go to task</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
